<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>امشب نوبت کیه؟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tile: #16302e;
        --tile-2: #1f413e;
        --porcelain: #f6f3ec;
        --glove: #f2b33d;
        --suds: #9fcfc6;
        --ink: #12201e;
        --danger: #c1533e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--tile);
        background-image:
          radial-gradient(
            circle at 20% 10%,
            rgba(159, 207, 198, 0.1),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 85%,
            rgba(242, 179, 61, 0.08),
            transparent 45%
          );
        font-family: "Vazirmatn", system-ui, sans-serif;
        color: var(--porcelain);
        display: flex;
        justify-content: center;
        padding: 28px 16px 60px;
        max-width: 100% !important;
        width: 100% !important;
        overflow-x: hidden !important;
        overflow-y: scroll !important;
      }

      .app {
        width: 100%;
        max-width: 460px;
      }

      header {
        text-align: center;
        margin-bottom: 26px;
      }

      h1 {
        font-size: 30px;
        font-weight: 900;
        margin: 0 0 6px;
        line-height: 1.3;
      }

      p.sub {
        color: var(--suds);
        font-size: 14.5px;
        margin: 0;
        opacity: 0.9;
      }

      .wheel-zone {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 36px auto 22px;
      }

      .pointer {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid var(--glove);
        z-index: 5;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
      }

      .plate-rim {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: var(--porcelain);
        box-shadow:
          0 0 0 6px rgba(255, 255, 255, 0.06),
          0 18px 34px rgba(0, 0, 0, 0.4);
      }

      .wheel {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        transition: transform 3.6s cubic-bezier(0.17, 0.83, 0.24, 1);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.5);
      }

      .wheel-label {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        font-weight: 700;
        font-size: 14px;
        color: var(--ink);
        transform-origin: 0 50%;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        pointer-events: none;
      }

      .hub {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 54px;
        height: 54px;
        background: var(--tile-2);
        border: 3px solid var(--glove);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .spin-btn {
        display: block;
        width: 100%;
        padding: 15px;
        background: var(--glove);
        color: var(--ink);
        font-family: inherit;
        font-weight: 900;
        font-size: 17px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow:
          0 8px 0 #b17d1b,
          0 12px 20px rgba(0, 0, 0, 0.35);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
        margin-top: 40px;
      }
      .spin-btn:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 #b17d1b,
          0 4px 10px rgba(0, 0, 0, 0.3);
      }
      .spin-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        margin-top: 22px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 18px;
        text-align: center;
        min-height: 32px;
      }
      .result .who {
        font-size: 22px;
        font-weight: 900;
        color: var(--glove);
      }
      .result .why {
        font-size: 13px;
        color: var(--suds);
        margin-top: 4px;
        opacity: 0.85;
      }

      .roster {
        margin-top: 28px;
      }
      .roster h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--suds);
        margin: 0 0 10px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chip button {
        background: none;
        border: none;
        color: var(--danger);
        font-weight: 900;
        cursor: pointer;
        font-size: 15px;
        padding: 0;
        line-height: 1;
      }

      .add-row {
        display: flex;
        gap: 8px;
      }
      .add-row input {
        flex: 1;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.05);
        color: var(--porcelain);
        font-family: inherit;
        font-size: 14px;
      }
      .add-row input::placeholder {
        color: rgba(246, 243, 236, 0.4);
      }
      .add-row button {
        background: var(--suds);
        color: var(--ink);
        border: none;
        border-radius: 12px;
        padding: 0 18px;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
      }

      .history {
        margin-top: 22px;
        font-size: 13px;
        color: var(--suds);
        opacity: 0.8;
        line-height: 2;
      }
      .history b {
        color: var(--porcelain);
      }

      footer {
        text-align: center;
        margin-top: 32px;
        font-size: 12px;
        color: var(--glove);
        font-weight: bold !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .wheel {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>امشب ظرفها با کیه؟</h1>
        <p class="sub">اسم همخونه هات رو بنویس، بچرخون، بحث تمومه.</p>
      </header>

      <div class="wheel-zone">
        <div class="plate-rim"></div>
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="hub">🍽️</div>
      </div>

      <button class="spin-btn" id="spinBtn">بچرخون ببین نوبت کیه</button>

      <div class="result" id="result">
        <div class="who">هنوز کسی مشخص نشده</div>
        <div class="why">اسم ها رو اضافه کن و بچرخون</div>
      </div>

      <div class="roster">
        <h2>همخونه ها :</h2>
        <div class="chips" id="chips"></div>
        <div class="add-row">
          <input
            id="nameInput"
            type="text"
            placeholder="اسم رو بنویس و اینتر بزن"
            maxlength="14"
          />
          <button id="addBtn">اضافه کن</button>
        </div>
      </div>

      <div class="history" id="history"></div>

      <footer>ConDev ©</footer>
    </div>

    <script>
      const wheel = document.getElementById("wheel");
      const spinBtn = document.getElementById("spinBtn");
      const resultEl = document.getElementById("result");
      const chipsEl = document.getElementById("chips");
      const nameInput = document.getElementById("nameInput");
      const addBtn = document.getElementById("addBtn");
      const historyEl = document.getElementById("history");

      const colors = ["#F2B33D", "#9FCFC6", "#F6F3EC", "#E88D6B"];

      let names = ["نیوشا", "آرمین", "پارسا"];
      let lastWinner = null;
      let history = [];
      let spinning = false;
      let currentRotation = 0;

      function renderChips() {
        chipsEl.innerHTML = "";
        names.forEach((name, i) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.innerHTML = `<span>${name}</span>`;
          const removeBtn = document.createElement("button");
          removeBtn.textContent = "×";
          removeBtn.onclick = () => {
            names.splice(i, 1);
            renderChips();
            renderWheel();
          };
          chip.appendChild(removeBtn);
          chipsEl.appendChild(chip);
        });
      }

      function renderWheel() {
        wheel.innerHTML = "";
        const n = names.length;
        if (n === 0) {
          wheel.style.background = "var(--tile-2)";
          return;
        }
        const slice = 360 / n;
        const gradientParts = [];
        names.forEach((name, i) => {
          const color = colors[i % colors.length];
          const start = i * slice;
          const end = (i + 1) * slice;
          gradientParts.push(`${color} ${start}deg ${end}deg`);

          const label = document.createElement("div");
          label.className = "wheel-label";
          const midAngle = start + slice / 2;
          label.style.transform = `rotate(${midAngle - 90}deg) translate(50px)`;
          label.textContent = name;
          wheel.appendChild(label);
        });
        wheel.style.background = `conic-gradient(${gradientParts.join(",")})`;
      }

      function addName() {
        const val = nameInput.value.trim();
        if (!val) return;
        if (names.length >= 8) {
          alert("تا ۸ نفر جواب میده، بیشتر از این شلوغ میشه");
          return;
        }
        names.push(val);
        nameInput.value = "";
        renderChips();
        renderWheel();
      }

      addBtn.onclick = addName;
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addName();
      });

      function pickIndex() {
        if (names.length === 1) return 0;
        let idx;
        do {
          idx = Math.floor(Math.random() * names.length);
        } while (names[idx] === lastWinner && names.length > 1);
        return idx;
      }

      spinBtn.onclick = () => {
        if (spinning) return;
        if (names.length === 0) {
          alert("اول یه اسم اضافه کن");
          return;
        }
        spinning = true;
        spinBtn.disabled = true;

        const n = names.length;
        const slice = 360 / n;
        const winnerIndex = pickIndex();
        const targetMid = winnerIndex * slice + slice / 2;

        const fullSpins = 5 * 360;
        const finalRotation =
          currentRotation +
          fullSpins +
          (360 - (currentRotation % 360)) -
          targetMid;

        currentRotation = finalRotation;
        wheel.style.transform = `rotate(${finalRotation}deg)`;

        setTimeout(() => {
          const winner = names[winnerIndex];
          lastWinner = winner;
          history.unshift(winner);
          history = history.slice(0, 5);
          resultEl.innerHTML = `
        <div class="who">امشب نوبت ${winner}ـه 🎉</div>
        <div class="why">بدون بحث، بدون بهانه</div>
      `;
          renderHistory();
          spinning = false;
          spinBtn.disabled = false;
        }, 3700);
      };

      function renderHistory() {
        if (history.length === 0) {
          historyEl.textContent = "";
          return;
        }
        historyEl.innerHTML =
          "تاریخچه: " + history.map((h) => `<b>${h}</b>`).join(" ← ");
      }

      renderChips();
      renderWheel();
    </script>
  </body>
</html>
